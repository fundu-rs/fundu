name: Build and Check

on:
  push:
    branches: ["main", "cicd", "release", "develop", "develop-gamma"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      resetBenchmarks:
        description: "Reset the benchmark data"
        required: true
        type: boolean

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  BENCHMARK_REGRESSION_PERCENT_FAIL: 10

jobs:
  deny:
    name: Check dependencies/ubuntu-latest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          rust-version: "1.85.0"

  minimal_versions:
    needs: [deny]
    name: Build and check with minimal versions
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        toolchain:
          - "1.85.1" # MSRV
          - stable
          - nightly
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.toolchain }}
      - uses: taiki-e/install-action@cargo-hack
      - uses: taiki-e/install-action@cargo-minimal-versions
      - uses: taiki-e/install-action@just
      # This'll run without checking dev-dependencies
      - name: Build with minimal versions
        run: just minimal-versions

  format:
    name: Check format with nightly rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - uses: taiki-e/install-action@just
      - run: just check-fmt

  base:
    needs: [format]
    name: Build, check and test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        toolchain:
          - "1.85.1" # MSRV
          - stable
          - nightly
        include:
          - components: clippy
            toolchain: stable
          - features: standard,custom,time,chrono,serde,base,with-gungraun,with-flamegraph
          - features: standard,custom,time,chrono,serde,base
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: ${{ matrix.components }}
      - name: Prepare
        if: matrix.toolchain != 'stable'
        run: |
          rustup toolchain install stable --no-self-update --component clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: "${{ matrix.os }}_${{ matrix.toolchain }}"
      - uses: taiki-e/install-action@just
      - name: Info if unix
        if: ${{ matrix.os != 'windows-latest' }}
        run: |
          set -x
          uname -a
          pwd
          rustup --version
          rustup show
          rustup component list --installed
      - name: Info if windows
        if: ${{ matrix.os == 'windows-latest' }}
        shell: bash
        run: |
          set -x
          rustup show
          rustup component list --installed
      - name: Update locked dependencies
        if: matrix.toolchain == 'stable' || matrix.toolchain == 'nightly'
        run: |
          cargo update
      - name: Build
        run: just build "${{ matrix.features }}"
      - name: Lint
        run: just stable-clippy "${{ matrix.features }}"
      - name: Test
        run: just test "${{ matrix.features }}"

  cross:
    needs: [format]
    name: Cross build and test
    strategy:
      fail-fast: false
      matrix:
        target:
          ##### big endian targets #####
          - s390x-unknown-linux-gnu
          # - sparc64-unknown-linux-gnu
          - powerpc-unknown-linux-gnu
          # - mips-unknown-linux-musl
          ##### little endian targets #####
          - i686-unknown-linux-gnu
          - i586-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
          - arm-unknown-linux-gnueabihf
          # - riscv64gc-unknown-linux-gnu
          # dependency errors: quick-xml
          # - wasm32-unknown-emscripten
          # dependency errors: criterion
          # - x86_64-linux-android
          - x86_64-unknown-linux-musl
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.85.1"
      - uses: Swatinem/rust-cache@v2
        with:
          key: "${{ matrix.target }}"
      - uses: taiki-e/install-action@cross
      - uses: taiki-e/install-action@just
      - name: Info
        run: |
          set -x
          pwd
          rustup --version
          rustup show
          rustup component list --installed
          cargo --list
          cross --version
      - name: Build
        run: just cross-build "${{ matrix.target }}"
      - name: Test
        run: just cross-test "${{ matrix.target }}"

  docs:
    needs: [base, cross]
    name: Docs/ubuntu-latest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@just
      - name: Run doc tests
        run: just doc-test
      - name: Check Documentation
        run: just doc

  coverage:
    needs: [base, cross]
    name: Coverage/ubuntu-latest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - name: Install llvm
        run: sudo apt-get -y update && sudo apt-get -y install llvm
      - uses: taiki-e/install-action@grcov
      - uses: taiki-e/install-action@just
      - name: Info
        run: |
          set -x
          uname -a
          printenv | grep -i -e cargo -e rust -e llvm
          cargo -V
          rustup -V
          rustup show
          rustup component list --installed
      - name: Clean
        run: just coverage-clean
      - name: Build
        run: just coverage-build
      - name: Test
        run: just coverage-test
      - name: Generate code coverage
        run: just coverage-report
      - name: Upload to codecov.io
        uses: codecov/codecov-action@v7
        with:
          files: lcov.info
          fail_ci_if_error: false
    env:
      RUST_BACKTRACE: "0"

  fuzzing:
    needs: [base, cross]
    name: Fuzzy testing/ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        test:
          - package: fundu
            fuzz_target: f64_like_input
          - package: fundu
            fuzz_target: parse_single
          - package: fundu-gnu
            fuzz_target: parsing
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: "${{ matrix.test.package }}/fuzz"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
          components: llvm-tools
      - name: Prepare
        run: cargo install cargo-fuzz rustfilt
      - uses: taiki-e/install-action@just
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.test.fuzz_target }}
          workspaces: |
            ${{ matrix.test.package }}/fuzz -> target
          cache-on-failure: true
      - name: Run fuzzing for 5 minutes
        run: just fuzz-run "${{ matrix.test.package }}" "${{ matrix.test.fuzz_target }}" "300"
      - name: Create coverage.profdata
        run: just fuzz-coverage "${{ matrix.test.package }}" "${{ matrix.test.fuzz_target }}"
      - name: Create lcov coverage report
        run: just fuzz-report "${{ matrix.test.package }}" "${{ matrix.test.fuzz_target }}"
      - name: Upload to codecov.io
        uses: codecov/codecov-action@v7
        with:
          files: ${{ matrix.test.package }}/fuzz/lcov.info
          name: ${{ matrix.test.package }}-${{ matrix.test.fuzz_target }}
          override_branch: fuzzy-testing
          fail_ci_if_error: false

  benchmarks:
    needs: [base, cross]
    name: Benchmarks/ubuntu-latest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.85.1"
      - uses: taiki-e/install-action@cargo-binstall
      - name: Install gungraun-runner and Valgrind
        uses: gungraun/setup-gungraun@v1
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@just
      - name: Download reference benchmarks
        if: ${{ !inputs.resetBenchmarks }}
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow_conclusion: success
          name: gungraun-benchmarks
          check_artifacts: true
          if_no_artifact_found: warn
      - name: Run gungraun benchmarks
        run: just bench
      - uses: actions/upload-artifact@v7
        with:
          name: gungraun-benchmarks
          path: "target/gungraun"

  miri:
    needs: [base, cross]
    name: Tests/Miri
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - i686-unknown-linux-gnu # 32-bit
          - mips64-unknown-linux-gnuabi64 # big-endian
          - aarch64-unknown-linux-gnu
          - arm-unknown-linux-gnueabihf
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      # - uses: Swatinem/rust-cache@v2
      #   with:
      #     key: ${{ matrix.target }}
      #     cache-directories: /home/runner/.cache/miri
      - uses: taiki-e/install-action@cross
        if: matrix.target != 'x86_64-unknown-linux-gnu'
      - uses: taiki-e/install-action@just
      - name: Info
        run: |
          set -x
          pwd
          rustup --version
          rustup show
          rustup component list --installed
          cargo --list
      - name: Test with native Miri
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: just miri
      - name: Test with cross Miri
        if: matrix.target != 'x86_64-unknown-linux-gnu'
        run: just cross-miri "${{ matrix.target }}"
