[tool.bumpversion]
current_version = "0.4.1"
commit = true
tag = true
tag_name = "fundu-systemd-v{new_version}"
message = "Bump fundu-systemd version v{current_version} -> v{new_version}"

[[tool.bumpversion.files]]
filename = "fundu-systemd/Cargo.toml"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'

[[tool.bumpversion.files]]
filename = "fundu-systemd/README.md"
search = 'fundu-systemd = "{current_version}"'
replace = 'fundu-systemd = "{new_version}"'
